<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Four ztr_ssh sessions on one machine go through a single tunnel service, each over its own route, to four different servers. Each server sees only its route's exit address. Everything else on the machine uses the normal internet connection directly.">
  <title>One machine, four routes at once</title>
  <rect width="900" height="545" rx="14" fill="#08090b"/>
  <defs>
            <marker id="multiArrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#0dcaf0" />
            </marker>
            <marker id="multiArrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#8d949c" />
            </marker>
          </defs>
          <rect x="15" y="44" width="400" height="456" rx="12" fill="none" stroke="#343a40" stroke-dasharray="4,4" />
          <text x="35" y="68" fill="#e9ecef" font-size="13" font-weight="600">Bob's machine</text>
          <rect x="450" y="44" width="200" height="349" rx="12" fill="none" stroke="#343a40" stroke-dasharray="4,4" />
          <text x="470" y="68" fill="#e9ecef" font-size="13" font-weight="600">Relay network</text>
          <rect x="250" y="90" width="140" height="283" rx="8" fill="#0d0f11" stroke="#0dcaf0" stroke-width="1.5" />
          <text x="320" y="224" text-anchor="middle" fill="#e9ecef" font-size="14" font-weight="600">Tunnel service</text>
          <text x="320" y="246" text-anchor="middle" fill="#8d949c" font-size="10.5">one process,</text>
          <text x="320" y="261" text-anchor="middle" fill="#8d949c" font-size="10.5">many routes</text>

          <rect x="35" y="90" width="170" height="58" rx="8" fill="#0d0f11" stroke="#0dcaf0" />
          <text x="120" y="115" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">ztr_ssh</text>
          <text x="120" y="133" text-anchor="middle" fill="#8d949c" font-size="10.5">--config-file a.ztr</text>
          <rect x="470" y="90" width="160" height="58" rx="8" fill="#0d0f11" stroke="#0dcaf0" />
          <text x="550" y="115" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">Route A</text>
          <text x="550" y="133" text-anchor="middle" fill="#8d949c" font-size="10.5">exit: Germany</text>
          <rect x="700" y="90" width="185" height="58" rx="8" fill="#0d0f11" stroke="#20c997" />
          <text x="792" y="115" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">Server 1</text>
          <text x="792" y="133" text-anchor="middle" fill="#8d949c" font-size="10.5">sees only the exit's IP</text>
          <line x1="207" y1="119" x2="248" y2="119" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <line x1="392" y1="119" x2="468" y2="119" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <line x1="632" y1="119" x2="698" y2="119" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <rect x="35" y="165" width="170" height="58" rx="8" fill="#0d0f11" stroke="#0dcaf0" />
          <text x="120" y="190" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">ztr_ssh</text>
          <text x="120" y="208" text-anchor="middle" fill="#8d949c" font-size="10.5">--config-file b.ztr</text>
          <rect x="470" y="165" width="160" height="58" rx="8" fill="#0d0f11" stroke="#0dcaf0" />
          <text x="550" y="190" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">Route B</text>
          <text x="550" y="208" text-anchor="middle" fill="#8d949c" font-size="10.5">exit: Japan</text>
          <rect x="700" y="165" width="185" height="58" rx="8" fill="#0d0f11" stroke="#20c997" />
          <text x="792" y="190" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">Server 2</text>
          <text x="792" y="208" text-anchor="middle" fill="#8d949c" font-size="10.5">sees only the exit's IP</text>
          <line x1="207" y1="194" x2="248" y2="194" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <line x1="392" y1="194" x2="468" y2="194" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <line x1="632" y1="194" x2="698" y2="194" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <rect x="35" y="240" width="170" height="58" rx="8" fill="#0d0f11" stroke="#0dcaf0" />
          <text x="120" y="265" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">ztr_ssh</text>
          <text x="120" y="283" text-anchor="middle" fill="#8d949c" font-size="10.5">--config-file c.ztr</text>
          <rect x="470" y="240" width="160" height="58" rx="8" fill="#0d0f11" stroke="#0dcaf0" />
          <text x="550" y="265" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">Route C</text>
          <text x="550" y="283" text-anchor="middle" fill="#8d949c" font-size="10.5">exit: Brazil</text>
          <rect x="700" y="240" width="185" height="58" rx="8" fill="#0d0f11" stroke="#20c997" />
          <text x="792" y="265" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">Server 3</text>
          <text x="792" y="283" text-anchor="middle" fill="#8d949c" font-size="10.5">sees only the exit's IP</text>
          <line x1="207" y1="269" x2="248" y2="269" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <line x1="392" y1="269" x2="468" y2="269" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <line x1="632" y1="269" x2="698" y2="269" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <rect x="35" y="315" width="170" height="58" rx="8" fill="#0d0f11" stroke="#0dcaf0" />
          <text x="120" y="340" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">ztr_ssh</text>
          <text x="120" y="358" text-anchor="middle" fill="#8d949c" font-size="10.5">--config-file d.ztr</text>
          <rect x="470" y="315" width="160" height="58" rx="8" fill="#0d0f11" stroke="#0dcaf0" />
          <text x="550" y="340" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">Route D</text>
          <text x="550" y="358" text-anchor="middle" fill="#8d949c" font-size="10.5">exit: Canada</text>
          <rect x="700" y="315" width="185" height="58" rx="8" fill="#0d0f11" stroke="#20c997" />
          <text x="792" y="340" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">Server 4</text>
          <text x="792" y="358" text-anchor="middle" fill="#8d949c" font-size="10.5">sees only the exit's IP</text>
          <line x1="207" y1="344" x2="248" y2="344" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <line x1="392" y1="344" x2="468" y2="344" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <line x1="632" y1="344" x2="698" y2="344" stroke="#0dcaf0" stroke-width="1.25" marker-end="url(#multiArrowC)" />
          <rect x="35" y="425" width="200" height="58" rx="8" fill="#0d0f11" stroke="#343a40" />
          <text x="135" y="450" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">Everything else</text>
          <text x="135" y="468" text-anchor="middle" fill="#8d949c" font-size="10.5">browser, apps, updates</text>
          <rect x="700" y="425" width="185" height="58" rx="8" fill="#0d0f11" stroke="#343a40" />
          <text x="792" y="450" text-anchor="middle" fill="#e9ecef" font-size="13" font-weight="600">The internet</text>
          <text x="792" y="468" text-anchor="middle" fill="#8d949c" font-size="10.5">no relay involved</text>
          <line x1="237" y1="454" x2="698" y2="454" stroke="#8d949c" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#multiArrowG)" />

          <text x="450" y="528" text-anchor="middle" fill="#495057" font-size="10.5">Four routes at once from one machine — the example exit countries are placeholders for whichever exits your routes use.</text>
</svg>
